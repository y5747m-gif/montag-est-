<div id="app" class="app">

  <!-- ============ شريط القوائم ============ -->
  <header class="menubar">
    <div class="brand">
      <span class="brand-mark"><img src="assets/icon-192.png" alt="" width="20" height="20" style="border-radius:5px;display:block" /></span>
      <span class="brand-name">Montage&nbsp;Studio</span>
      <span class="brand-ver" id="brand-version">1.0</span>
    </div>
    <nav class="menu-root" id="menu-root"></nav>
    <div class="menubar-spacer"></div>
    <div class="workspace-tabs" id="workspace-tabs"></div>
    <div class="menubar-actions">
      <button class="tb-btn ghost" id="btn-undo" data-i18n-title="undo" title="تراجع (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
      <button class="tb-btn ghost" id="btn-redo" data-i18n-title="redo" title="إعادة (Ctrl+Shift+Z)"><svg><use href="#i-redo"/></svg></button>
      <span class="sep"></span>
      <a class="tb-link" href="mobile.html" title="الانتقال إلى نسخة الهاتف"><svg><use href="#i-camera"/></svg><span>نسخة الهاتف</span></a>
      <button class="tb-btn ghost" id="btn-lang" title="تغيير اللغة / Switch language"><span id="lang-label">EN</span></button>
      <button class="tb-btn ghost" id="btn-help" title="اختصارات لوحة المفاتيح"><svg><use href="#i-settings"/></svg></button>
      <button class="btn primary" id="btn-export"><svg><use href="#i-export"/></svg><span data-i18n="render">تصدير</span></button>
    </div>
  </header>

  <!-- ============ شريط الأدوات ============ -->
  <div class="toolbar" id="toolbar">
    <div class="tool-group" data-toolgroup="main"></div>
    <div class="tool-sep"></div>
    <div class="tool-group" data-toolgroup="shapes"></div>
    <div class="tool-sep"></div>
    <div class="tool-group" data-toolgroup="misc"></div>
    <div class="tool-spacer"></div>
    <button class="tool-btn" id="btn-add-media" data-i18n-title="import" title="استيراد ملفات"><svg><use href="#i-plus"/></svg></button>
    <input type="file" id="file-input" multiple hidden />
  </div>

  <!-- ============ منطقة العمل ============ -->
  <main class="workspace" id="workspace">

    <!-- العمود الأيمن (في RTL): لوحة المشروع والتأثيرات -->
    <section class="col col-side" id="col-left">
      <div class="panel" id="panel-project" data-panel="project">
        <header class="panel-head">
          <div class="panel-tabs" data-tabs="project">
            <button class="ptab active" data-tab="assets"><svg><use href="#i-folder"/></svg><span data-i18n="assets">المشروع</span></button>
            <button class="ptab" data-tab="effects"><svg><use href="#i-effects"/></svg><span data-i18n="effects">التأثيرات</span></button>
            <button class="ptab" data-tab="presets"><svg><use href="#i-star2"/></svg><span data-i18n="presets">القوالب</span></button>
          </div>
          <div class="panel-head-actions">
            <button class="tb-btn ghost sm" id="btn-panel-menu" title="خيارات"><svg><use href="#i-chevron"/></svg></button>
          </div>
        </header>
        <div class="panel-body">
          <div class="tab-body active" data-tabbody="assets">
            <div class="panel-subhead">
              <div class="search-box"><svg><use href="#i-search"/></svg><input id="assets-search" placeholder="بحث في المشروع…" /></div>
              <button class="tb-btn ghost sm" id="btn-new-comp" title="تركيب جديد"><svg><use href="#i-comp"/></svg></button>
              <button class="tb-btn ghost sm" id="btn-new-folder" title="مجلد جديد"><svg><use href="#i-folder"/></svg></button>
            </div>
            <div class="asset-list" id="asset-list"></div>
          </div>
          <div class="tab-body" data-tabbody="effects">
            <div class="panel-subhead">
              <div class="search-box"><svg><use href="#i-search"/></svg><input id="effects-search" placeholder="ابحث عن تأثير…" /></div>
            </div>
            <div class="fx-browser" id="effects-browser"></div>
          </div>
          <div class="tab-body" data-tabbody="presets">
            <div class="fx-browser" id="presets-browser"></div>
          </div>
        </div>
      </div>
      <div class="splitter-v" data-split="left-vertical"></div>
      <div class="panel" id="panel-history" data-panel="history">
        <header class="panel-head"><div class="panel-tabs"><button class="ptab active"><svg><use href="#i-undo"/></svg><span data-i18n="history">السجل</span></button></div></header>
        <div class="panel-body"><div class="history-list" id="history-list"></div></div>
      </div>
    </section>

    <div class="splitter-h" data-split="left"></div>

    <!-- العمود الأوسط: العارض + الخط الزمني -->
    <section class="col col-center" id="col-center">
      <div class="panel viewer-panel" id="panel-viewer">
        <header class="panel-head">
          <div class="panel-tabs" id="viewer-tabs"></div>
          <div class="panel-head-actions" id="viewer-actions">
            <button class="tb-btn ghost sm" data-viewer-action="zoom-out" title="تصغير"><svg><use href="#i-zoom"/></svg></button>
            <select id="viewer-zoom" class="mini-select" title="مستوى التكبير"></select>
            <select id="viewer-res" class="mini-select" title="دقة المعاينة"></select>
            <button class="tb-btn ghost sm" data-viewer-action="transparency" title="خلفية شفافة"><svg><use href="#i-grid"/></svg></button>
            <button class="tb-btn ghost sm" data-viewer-action="guides" title="الأدلة والأمان"><svg><use href="#i-guides"/></svg></button>
            <button class="tb-btn ghost sm" data-viewer-action="fit" title="ملء الشاشة (Shift+/)"><svg><use href="#i-fit"/></svg></button>
            <span class="sep"></span>
            <button class="tb-btn ghost sm" data-viewer-action="snapshot" title="حفظ الإطار الحالي كصورة PNG"><svg><use href="#i-image"/></svg></button>
          </div>
        </header>
        <div class="panel-body viewer-body" id="viewer-body">
          <canvas id="viewer-canvas" class="viewer-canvas"></canvas>
          <div class="viewer-overlay" id="viewer-overlay"></div>
          <div class="viewer-badge" id="viewer-badge"></div>
          <div class="viewer-hint" id="viewer-hint"></div>
        </div>
        <footer class="transport" id="transport">
          <div class="transport-left">
            <input class="timecode-input" id="tc-current" value="00:00:00:00" spellcheck="false" />
            <span class="tc-sep">/</span>
            <input class="timecode-input dim" id="tc-duration" value="00:00:10:00" readonly />
          </div>
          <div class="transport-center" id="transport-buttons"></div>
          <div class="transport-right">
            <label class="mini-field" title="الإطارات في الثانية"><span data-i18n="fps">FPS</span><input id="comp-fps" type="number" min="1" max="120" step="1" value="30" /></label>
            <label class="mini-field" title="مدة منطقة العمل"><span data-i18n="workarea">منطقة العمل</span><input id="workarea-dur" value="00:00:10:00" spellcheck="false" /></label>
          </div>
        </footer>
      </div>

      <div class="splitter-v" data-split="center-vertical"></div>

      <div class="panel timeline-panel" id="panel-timeline">
        <header class="panel-head">
          <div class="panel-tabs">
            <button class="ptab active" id="tab-timeline"><svg><use href="#i-timeline"/></svg><span data-i18n="timeline">الخط الزمني</span></button>
            <button class="ptab" id="tab-graph"><svg><use href="#i-graph"/></svg><span data-i18n="graph">محرر المنحنيات</span></button>
          </div>
          <div class="panel-head-actions">
            <button class="tb-btn ghost sm" data-tl-action="snap" title="التصاق (Snap)"><svg><use href="#i-snap"/></svg></button>
            <button class="tb-btn ghost sm" data-tl-action="zoom-out" title="تصغير الخط الزمني">−</button>
            <input id="tl-zoom" type="range" min="1" max="60" step="0.5" value="14" class="mini-range" title="تكبير الخط الزمني" />
            <button class="tb-btn ghost sm" data-tl-action="zoom-in" title="تكبير الخط الزمني">+</button>
            <button class="tb-btn ghost sm" data-tl-action="fit" title="ملء العرض">↔</button>
            <button class="tb-btn ghost sm" data-tl-action="add-keyframe" title="إضافة مفتاح في الموضع الحالي"><svg><use href="#i-diamond"/></svg></button>
            <button class="tb-btn ghost sm" data-tl-action="split" title="تقسيم الطبقات (Ctrl+Shift+D)"><svg><use href="#i-razor"/></svg></button>
            <button class="tb-btn ghost sm" data-tl-action="add-layer" title="طبقة جديدة"><svg><use href="#i-plus"/></svg></button>
          </div>
        </header>
        <div class="panel-body timeline-body" id="timeline-body">
          <div class="timeline-head" id="timeline-head">
            <div class="tl-corner">
              <span data-i18n="layer">طبقة</span>
              <button class="tb-btn ghost sm" id="tl-columns-btn" title="أعمدة إضافية"><svg><use href="#i-chevron"/></svg></button>
            </div>
            <div class="tl-ruler-wrap" id="tl-ruler-wrap"><canvas id="tl-ruler"></canvas></div>
          </div>
          <div class="timeline-main" id="timeline-main">
            <div class="tl-layers" id="tl-layers"></div>
            <div class="tl-tracks-wrap" id="tl-tracks-wrap"><div class="tl-tracks" id="tl-tracks"></div></div>
          </div>
          <div class="graph-editor" id="graph-editor" hidden>
            <canvas id="graph-canvas"></canvas>
            <div class="graph-toolbar" id="graph-toolbar"></div>
          </div>
        </div>
        <footer class="tl-footer">
          <div class="tl-footer-left">
            <button class="tb-btn ghost sm" data-tl-action="deselect"><span data-i18n="deselect">إلغاء التحديد</span></button>
            <span class="tl-info" id="tl-info"></span>
          </div>
          <div class="tl-footer-right">
            <label class="mini-field"><span data-i18n="duration">المدة</span><input id="comp-duration" value="00:00:10:00" spellcheck="false" /></label>
          </div>
        </footer>
      </div>
    </section>

    <div class="splitter-h" data-split="right"></div>

    <!-- العمود الأيسر (في RTL): الخصائص -->
    <section class="col col-props" id="col-right">
      <div class="panel" id="panel-props">
        <header class="panel-head">
          <div class="panel-tabs">
            <button class="ptab active"><svg><use href="#i-settings"/></svg><span data-i18n="properties">الخصائص</span></button>
          </div>
          <div class="panel-head-actions">
            <button class="tb-btn ghost sm" id="btn-props-menu" title="خيارات"><svg><use href="#i-chevron"/></svg></button>
          </div>
        </header>
        <div class="panel-body props-body" id="props-body"></div>
      </div>
    </section>
  </main>

  <!-- ============ شريط الحالة ============ -->
  <footer class="statusbar">
    <span id="status-message">جاهز</span>
    <span class="status-spacer"></span>
    <span id="status-stats"></span>
    <span class="status-dot" id="status-autosave" title="الحفظ التلقائي"></span>
  </footer>
</div>

<!-- طبقات عامة: قوائم سياق، نوافذ، تنبيهات -->
<div id="context-menu-root" class="context-menu-root"></div>
<div id="dialog-root" class="dialog-root"></div>
<div id="toast-root" class="toast-root"></div>
<div id="drop-overlay" class="drop-overlay"><div class="drop-card"><svg><use href="#i-export"/></svg><b>أفلت الملفات لاستيرادها إلى المشروع</b><span>فيديو • صوت • صور • مشروع ‎.mgeproj</span></div></div>
<div id="boot-splash" class="boot-splash">
  <div class="boot-card">
    <div class="boot-logo"><img src="assets/icon-192.png" alt="" width="64" height="64" style="border-radius:16px;display:block;box-shadow:0 12px 36px rgba(74,157,255,.4)" /></div>
    <h1>Montage Studio</h1>
    <p>استوديو المونتاج والموشن جرافيك — تحميل المحرّك…</p>
    <div class="boot-bar"><i id="boot-progress"></i></div>
    <small id="boot-status">تهيئة واجهة المستخدم</small>
  </div>
</div>

<script type="module" src="src/main.js"></script>
<script>
  // تسجيل العامل الخدمي (العمل دون اتصال) + إمكانية التثبيت من شريط المتصفح
  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
