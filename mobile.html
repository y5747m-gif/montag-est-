<!DOCTYPE html>
<!-- نسخة الهاتف — واجهة تطبيق مخصّصة للمس، مختلفة تمامًا عن نسخة الكمبيوتر -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#140c22" />
<title>Montage Studio — نسخة الهاتف</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles/mobile.css" />
</head>
<body>

<!-- ============ أيقونات SVG (مجموعة مخصصة للهاتف) ============ -->
<svg id="icon-sprite" aria-hidden="true" style="display:none">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M16 6l-7 6 7 6z" fill="currentColor"/><path d="M8 6h1.6v12H8z" fill="currentColor"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M4 10a6 6 0 016-6h6l-2.5-2.5M20 14a6 6 0 01-6 6H8l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 8V5.5A1.5 1.5 0 0014.5 4h-9A1.5 1.5 0 004 5.5v9A1.5 1.5 0 005.5 16H8" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 5l15 15M9.5 9.7A2.6 2.6 0 0012 14.6M6.6 7.3C4 9 2.5 12 2.5 12s3.5 5.5 9.5 5.5c1.6 0 3-.4 4.2-1M17 15.6c2.6-1.7 4.5-3.6 4.5-3.6S18 6.5 12 6.5c-.6 0-1.2.1-1.7.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-effects" viewBox="0 0 24 24"><path d="M12 3l2 5.5L19.5 10 14 12l-2 6-2-6-5.5-2L10 8.5z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M18.5 16.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" fill="currentColor"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5l1.3 2.3 2.6-.5.6 2.6 2.3 1.3-1.2 2.4 1.2 2.4-2.3 1.3-.6 2.6-2.6-.5L12 21.5l-1.3-2.3-2.6.5-.6-2.6L5.2 15.8 6.4 13.4 5.2 11l2.3-1.3.6-2.6 2.6.5z" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 014.5 5h4.6l1.8 2.4h8.6A1.5 1.5 0 0121 8.9v9.6a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 18.5z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 16l5-4 4 3 3-2.5 6 4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8.5" cy="9.5" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 11l5-2.5v7L16 13z" fill="currentColor"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M5 14v-4M9 17V7M13 15.5v-7M17 18V6M21 14.5v-5" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-shapes" viewBox="0 0 24 24"><circle cx="8" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="12" y="12" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-rect" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.2" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 6.1 6.6.5-5 4.3 1.5 6.4L12 16.9 6.3 20.3l1.5-6.4-5-4.3 6.6-.5z" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-solid" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="currentColor" opacity=".85"/></symbol>
    <symbol id="i-adjust" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4a8 8 0 000 16z" fill="currentColor"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12c2-6 4-6 6 0s4 6 6 0 4-6 6 0" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 4l1.8 4.9L18.7 10.7 13.8 12.5 12 17.4 10.2 12.5 5.3 10.7 10.2 8.9z" fill="currentColor"/><circle cx="18.5" cy="5.5" r="1.3" fill="currentColor"/><circle cx="5.5" cy="17.5" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4l4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M5 15v3.5A1.5 1.5 0 006.5 20h11a1.5 1.5 0 001.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4v5h6V4M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 014.5 5h4l2 2.5h7A1.5 1.5 0 0119 9v8.5A1.5 1.5 0 0117.5 19h-13A1.5 1.5 0 013 17.5z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7H5V3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5 7a8 8 0 116.5 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 7h4V3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19 7A8 8 0 1012.5 19.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 20.5h6M12 16.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 5h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-keyframe" viewBox="0 0 24 24"><path d="M12 4l8 8-8 8-8-8z" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="m-app" class="m-app">

  <!-- ============ الشريط العلوي ============ -->
  <header class="m-topbar">
    <div class="m-brand">
      <div class="m-brand-mark">M</div>
      <div class="m-brand-name">
        <b id="m-project-name">Montage Studio</b>
        <span>نسخة الهاتف</span>
      </div>
    </div>
    <div class="m-topbar-spacer"></div>
    <button class="m-iconbtn" id="m-btn-undo" title="تراجع"><svg><use href="#i-undo"/></svg></button>
    <button class="m-iconbtn" id="m-btn-redo" title="إعادة"><svg><use href="#i-redo"/></svg></button>
    <button class="m-iconbtn accent" id="m-btn-export" title="تصدير"><svg><use href="#i-export"/></svg></button>
  </header>

  <!-- ============ المعاينة ============ -->
  <main class="m-stage" id="m-stage">
    <div class="m-canvas-wrap" id="m-canvas-wrap">
      <canvas id="m-canvas"></canvas>
    </div>
    <div class="m-stage-badge" id="m-stage-badge">1920×1080 · 30fps</div>
    <button class="m-playfab" id="m-playfab" title="تشغيل / إيقاف"><svg><use href="#i-play"/></svg></button>
  </main>

  <!-- ============ شريط التشغيل ============ -->
  <div class="m-scrub">
    <button class="m-iconbtn big accent" id="m-btn-play" title="تشغيل / إيقاف"><svg><use href="#i-play"/></svg></button>
    <div class="m-timecode"><b id="m-tc-current">00:00:00:00</b> / <span id="m-tc-duration">00:00:10:00</span></div>
    <input type="range" class="m-range" id="m-scrubber" min="0" max="300" step="1" value="0" />
    <button class="m-iconbtn toggle" id="m-btn-loop" title="تكرار التشغيل"><svg><use href="#i-loop"/></svg></button>
  </div>

  <!-- ============ اللوحة السفلية ============ -->
  <section class="m-sheet" id="m-sheet">
    <div class="m-sheet-head" id="m-sheet-head">
      <div class="m-sheet-grip"></div>
      <div>
        <div class="m-sheet-title" id="m-sheet-title">الرئيسية</div>
        <div class="m-sheet-sub" id="m-sheet-sub">إضافة سريعة</div>
      </div>
      <button class="m-iconbtn" id="m-btn-collapse" title="طي اللوحة"><svg><use href="#i-caret"/></svg></button>
    </div>
    <div class="m-tabbody" id="m-tab-home"></div>
    <div class="m-tabbody" id="m-tab-layers" hidden></div>
    <div class="m-tabbody" id="m-tab-media" hidden></div>
    <div class="m-tabbody" id="m-tab-effects" hidden></div>
    <div class="m-tabbody" id="m-tab-props" hidden></div>
  </section>

  <!-- ============ شريط التنقل السفلي ============ -->
  <nav class="m-nav" id="m-nav">
    <button class="m-nav-btn active" data-mtab="home"><svg><use href="#i-plus"/></svg><span>الرئيسية</span></button>
    <button class="m-nav-btn" data-mtab="layers"><svg><use href="#i-layers"/></svg><span>الطبقات</span></button>
    <button class="m-nav-btn" data-mtab="media"><svg><use href="#i-folder"/></svg><span>الوسائط</span></button>
    <button class="m-nav-btn" data-mtab="effects"><svg><use href="#i-effects"/></svg><span>التأثيرات</span></button>
    <button class="m-nav-btn" data-mtab="props"><svg><use href="#i-settings"/></svg><span>الخصائص</span></button>
  </nav>

  <!-- ============ ورقة التصدير ============ -->
  <div class="m-overlay" id="m-overlay"></div>
  <div class="m-export" id="m-export">
    <div class="m-export-head">
      <b>تصدير</b>
      <button class="m-iconbtn" id="m-btn-export-close" title="إغلاق"><svg><use href="#i-close"/></svg></button>
    </div>
    <div id="m-export-options">
      <button class="m-export-opt" data-mexport="png">
        <span class="m-ex-ico"><svg><use href="#i-image"/></svg></span>
        <span><b>صورة PNG</b><span>تصدير الإطار الحالي بجودة كاملة</span></span>
      </button>
      <button class="m-export-opt" data-mexport="webm">
        <span class="m-ex-ico"><svg><use href="#i-video"/></svg></span>
        <span><b>فيديو WebM</b><span>تسجيل التركيب كاملًا بدقة العرض</span></span>
      </button>
      <button class="m-export-opt" data-mexport="json">
        <span class="m-ex-ico"><svg><use href="#i-save"/></svg></span>
        <span><b>مشروع ‎.mgeproj</b><span>حفظ المشروع لفتحه في نسخة الكمبيوتر</span></span>
      </button>
    </div>
    <div class="m-progress" id="m-export-progress"><i></i></div>
    <div class="m-progress-label" id="m-export-label"></div>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <!-- ============ شاشة الإقلاع ============ -->
  <div id="m-boot" class="m-boot">
    <div class="m-boot-card">
      <div class="m-boot-logo">M</div>
      <h1>Montage Studio</h1>
      <p>نسخة الهاتف — تحميل المحرّك…</p>
      <div class="m-boot-bar"><i id="m-boot-bar"></i></div>
    </div>
  </div>
</div>

<input type="file" id="m-file-input" multiple accept="video/*,audio/*,image/*" hidden />
<script type="module" src="src/mobile.js"></script>
</body>
</html>
